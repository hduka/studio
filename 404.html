<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hduka Studio —— 页面未找到（404）。">
<meta name="theme-color" content="#3498db">
<title>hduka studio | 404</title>

<style>
  /* ---------- 主题变量（洛谷配色） ---------- */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #333333;
    --fg-2: #555555;
    --muted: #999999;
    --line: #e8e8e8;
    --line-strong: #d8d8d8;
    --accent: #3498db;
    --accent-hover: #2980b9;
    --accent-bg: #eaf4fc;
    --accent-bd: #bfe0f5;
    --radius: 4px;

    --side-w: 60px;
    --side-w-open: 200px;
    --side-ease: cubic-bezier(.4, 0, .2, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c1f;
      --surface: #232629;
      --fg: #d6d8da;
      --fg-2: #a8abae;
      --muted: #808388;
      --line: #33363a;
      --line-strong: #3d4045;
      --accent: #5dade2;
      --accent-hover: #85c1e9;
      --accent-bg: #1c2b36;
      --accent-bd: #2c4a5e;
    }
  }

  /* ---------- 基础 ---------- */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 页脚 ---------- */
  footer {
    padding: 1.5rem 0 2.5rem;
    margin-top: clamp(1.4rem, 3.5vw, 2rem);
    font-size: .82em;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--line);
  }

  footer p { margin: 0; }

  /* ---------- 主内容 ---------- */
  .main {
    margin-left: var(--side-w);
    min-width: 0;
    padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1.25rem, 4vw, 2.5rem) 0;
    transition: margin-left .28s var(--side-ease);
  }

  .sidebar:hover ~ .main,
  .sidebar:focus-within ~ .main {
    margin-left: var(--side-w-open);
  }

  .main-inner {
    width: min(100%, 880px);
    margin-inline: auto;
  }

  /* ---------- 404 图片（缩至原图约 1/4） ---------- */
  .error-img {
    display: block;
    width: min(100%, 130px);
    height: auto;
    margin: 0 0 1.25rem 0;
    border-radius: var(--radius);
  }

  /* ---------- 标题 ---------- */
  .error-title {
    margin: 0 0 .3rem;
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 700;
    letter-spacing: -.01em;
    color: var(--fg);
  }

  .error-desc {
    margin: 0 0 1.5rem;
    font-size: .95em;
    color: var(--muted);
  }

  /* ---------- 按钮 ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    padding: .6rem 1.35rem;
    font-size: .92em;
    font-weight: 500;
    line-height: 1.4;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    text-decoration: none;
    cursor: pointer;
    transition: background-color .15s ease,
                border-color .15s ease,
                transform .15s ease,
                box-shadow .15s ease;
  }

  .btn:hover,
  .btn:focus-visible {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(52, 152, 219, .25);
  }

  .btn:active {
    transform: translateY(0);
    box-shadow: none;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 3px;
  }
</style>
</head>
<body>

  <main class="main">
    <div class="main-inner">

      <!-- 页首左侧 404 图片（缩至原图约 1/4） -->
      <img class="error-img"
           src="https://cdn.luogu.com.cn/upload/image_hosting/in6hkrrs.webp"
           alt="404 页面插图">

      <h1 class="error-title">404 NOT FOUND</h1>
      <p class="error-desc">您查找的网页可能已被移动或删除。</p>

      <a class="btn" href="https://hduka.github.io/studio/">
        <span aria-hidden="true">←</span>
        返回首页
      </a>

    </div>
  </main>

</body>
</html>
