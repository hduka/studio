<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hduka Studio —— 页面未找到（404）。">
<meta name="theme-color" content="#ece9d8">
<title>hduka studio | 404</title>

<style>
  /* ---------- XP 主题变量 ---------- */
  :root {
    --xp-face:     #ece9d8;   /* 面板米色 */
    --xp-btn-line: #003c74;   /* 按钮深蓝描边 */
    --xp-blue-1:   #0058ee;
    --xp-blue-2:   #3593ff;
    --xp-blue-3:   #288eff;
    --xp-blue-4:   #036ffc;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: Tahoma, "MS Sans Serif", "Microsoft YaHei", "宋体", sans-serif;
    font-size: 12px;
    line-height: 1.6;
    color: #000;
    background: var(--xp-face);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶部 XP 蓝色横条 ---------- */
  .header {
    padding: .45rem clamp(1rem, 4vw, 2rem);
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 1px 1px 1px rgba(0, 0, 0, .45);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    background: linear-gradient(to bottom,
      var(--xp-blue-1) 0%, var(--xp-blue-2) 8%,
      var(--xp-blue-3) 40%, var(--xp-blue-4) 93%, #0057e5 100%);

    border-bottom: 1px solid #003c9c;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35),
                inset 0 -1px 0 rgba(0, 0, 0, .25);
  }

  /* ---------- 内容区：铺满剩余空间 ---------- */
  .panel {
    flex: 1;
    width: 100%;
    padding: clamp(1.5rem, 5vw, 3rem) clamp(1.25rem, 5vw, 3rem);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .panel-inner {
    width: min(100%, 720px);
    margin-inline: auto;
  }

  /* ---------- 内容行 ---------- */
  .row {
    display: flex;
    gap: 1.25rem;
    align-items: flex-start;
  }

  .error-img {
    flex: none;
    width: 130px;
    max-width: 38%;
    height: auto;
    display: block;
  }

  .text { flex: 1; min-width: 0; }

  .error-title {
    margin: 0 0 .4rem;
    font-size: 16px;
    font-weight: bold;
  }

  .error-desc {
    margin: 0 0 .4rem;
    font-size: 12px;
    color: #333;
  }

  .error-path {
    margin: 0;
    font-family: "Courier New", Consolas, monospace;
    font-size: 11px;
    color: #777;
    word-break: break-all;
  }

  /* 凹陷分隔线 */
  .sep {
    height: 0;
    margin: 1.1rem 0 1rem;
    border: 0;
    border-top: 1px solid #d6d2c2;
    border-bottom: 1px solid #fff;
  }

  /* ---------- 按钮 ---------- */
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: .5rem;
  }

  .btn {
    min-width: 96px;
    padding: 3px 14px;
    font: inherit;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    text-decoration: none;
    color: #000;
    border: 1px solid var(--xp-btn-line);
    border-radius: 3px;
    background: linear-gradient(to bottom, #fff 0%, #f4f3ee 45%, #e3dfd2 100%);
    box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #c9c4b5;
    cursor: pointer;
    transition: background .1s ease;
  }

  .btn:hover,
  .btn:focus-visible {
    background: linear-gradient(to bottom, #fff8d8 0%, #fde89a 45%, #f8d34a 100%);
    outline: none;
  }

  .btn:active {
    background: linear-gradient(to bottom, #d5d2c4 0%, #e5e1d4 100%);
    box-shadow: inset 1px 1px 2px rgba(0, 0, 0, .2);
  }

  .btn:focus-visible {
    outline: 1px dotted #000;
    outline-offset: -4px;
  }

  /* ---------- 底部状态栏 ---------- */
  .statusbar {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    padding: .45rem clamp(1rem, 4vw, 2rem);
    background: var(--xp-face);
    border-top: 1px solid #9b9b8a;
    box-shadow: inset 0 1px 0 #fff;
    font-size: 11px;
    color: #333;
  }

  .status-panel {
    padding: 0 .55rem;
    border: 1px solid;
    border-color: #9b9b8a #fff #fff #9b9b8a;
    background: var(--xp-face);
  }

  .status-panel.grow { flex: 1; min-width: 6em; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 460px) {
    .row { flex-direction: column; align-items: center; text-align: center; }
    .error-img { width: 96px; max-width: 60%; }
    .actions { justify-content: stretch; }
    .btn { flex: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <!-- 顶部 XP 蓝色横条（只保留工作室名） -->
  <header class="header">Hduka Studio</header>

  <!-- 内容区 -->
  <main class="panel">
    <div class="panel-inner">

      <div class="row">
        <img class="error-img"
             src="https://cdn.luogu.com.cn/upload/image_hosting/in6hkrrs.webp"
             alt="404 页面插图">
        <div class="text">
          <h1 class="error-title">404 NOT FOUND</h1>
          <p class="error-desc">您查找的网页可能已被移动或删除。</p>
          <p class="error-path">无法找到请求的资源，请检查网址是否正确。</p>
        </div>
      </div>

      <hr class="sep">

      <div class="actions">
        <a class="btn" href="https://hduka.github.io/studio/">返回首页</a>
      </div>

    </div>
  </main>

  <!-- 底部状态栏 -->
  <div class="statusbar">
    <span class="status-panel grow">Hduka Studio · hduka c++</span>
    <span class="status-panel">© 2026</span>
    <span class="status-panel">v1.2.4</span>
  </div>

</body>
</html>
