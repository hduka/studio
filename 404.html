<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>hduka studio | 404</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Hduka Studio —— 2026 年 9 月创立的个人开发工作室，提供 C++ 命令行工具下载。">
<meta name="theme-color" content="#3498db">
<style>
	/* ---------- 主题变量（洛谷配色） ---------- */
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --fg: #333333;
    --fg-2: #555555;
    --muted: #999999;
    --line: #e8e8e8;
    --line-strong: #d8d8d8;
    --accent: #3498db;
    --accent-hover: #2980b9;
    --accent-bg: #eaf4fc;
    --accent-bd: #bfe0f5;
    --radius: 4px;

    --side-w: 60px;
    --side-w-open: 200px;
    --side-ease: cubic-bezier(.4, 0, .2, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1c1f;
      --surface: #232629;
      --fg: #d6d8da;
      --fg-2: #a8abae;
      --muted: #808388;
      --line: #33363a;
      --line-strong: #3d4045;
      --accent: #5dade2;
      --accent-hover: #85c1e9;
      --accent-bg: #1c2b36;
      --accent-bd: #2c4a5e;
    }
  }

  /* ---------- 基础 ---------- */
  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.7;
    color: var(--fg);
    background: var(--bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  /* ---------- 页脚 ---------- */
  footer {
    padding: 1.5rem 0 2.5rem;
    margin-top: clamp(1.4rem, 3.5vw, 2rem);
    font-size: .82em;
    color: var(--muted);
    text-align: center;
    border-top: 1px solid var(--line);
  }

  footer p { margin: 0; }
  .main {
    margin-left: var(--side-w);
    min-width: 0;
    padding: clamp(1.5rem, 4vw, 2.5rem) clamp(1.25rem, 4vw, 2.5rem) 0;
    transition: margin-left .28s var(--side-ease);
  }

  .sidebar:hover ~ .main,
  .sidebar:focus-within ~ .main {
    margin-left: var(--side-w-open);
  }

  .main-inner {
    width: min(100%, 880px);
    margin-inline: auto;
  }
</style>
</head>
<body>
 <main class="main">
    <div class="main-inner">
		<h1>404 NOT FOUND</h1>
 
		<h4>您查找的网页可能移动或删除</h4>

		<p><a href="https://hduka.github.io/studio/">返回首页</a></p>
 
</body>
</html>
